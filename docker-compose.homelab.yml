# Self-host overrides for a shared server: loopback-only ports and memory caps.
# Usage: docker compose -f docker-compose.yml -f docker-compose.homelab.yml up -d --build
# Dashboard: ssh -N -L 5175:127.0.0.1:5175 <server>, then open http://localhost:5175
services:
  backend:
    ports: !reset []
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 6.0
    environment:
      TRANSCRIBE_BACKEND: parakeet
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    ports: !override
      - "127.0.0.1:5175:5173"
    mem_limit: 512m
    logging: *logging

  renderer:
    ports: !reset []
    mem_limit: 1536m
    logging: *logging
