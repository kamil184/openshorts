name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the tests that need the real schema (citext,
    # jsonb, row locks): tests/test_support_ops.py. They skip without it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openshorts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/openshorts_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Test dependencies live in the `test` extra of pyproject.toml (the single
      # source of truth). The project is not packaged, so `pip install .[test]`
      # would need a buildable wheel; instead tomllib (stdlib on 3.11) prints the
      # extra's requirement lines and xargs hands them to pip. The extra covers
      # everything the collected tests import WITHOUT the heavy ML stack; the
      # pipeline modules import torch/ultralytics/mediapipe lazily behind their
      # feature gates, and the tests exercise the gated-off paths.
      - name: Install test dependencies
        run: |
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['test']))" \
            | xargs -d '\n' pip install
      - name: Run tests
        run: pytest tests/ -v
      # Import-layer contracts from pyproject.toml, report only: the step must
      # not fail the job while the migration is in progress. Switch to a
      # blocking run once the contracts hold.
      - name: Import contracts (report only)
        if: always()
        run: lint-imports || true

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
